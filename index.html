<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        #start {
            font-size: 14px;
            color: #aaa;
        }

        #message {
            display: none;
            text-align: center;
            font-size: 24px;
            line-height: 2;
        }
    </style>
</head>

<body>
    <div id="start">클릭하면 넘어가요</div>

    <div id="message">
        지금까지 오느라 많이 힘들었지?<br>
        이제 내가 있으니까 푹 쉬어<br>
        사랑해 ❤️
    </div>

    <script>
        document.body.addEventListener("click", function() {
            document.getElementById("start").style.display = "none";
            document.getElementById("message").style.display = "block";
        });
    </script>
</body>
</html>
